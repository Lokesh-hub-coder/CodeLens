services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - INDEX_STORAGE_DIR=/data/index
      - JAVA_PARSER_JAR_PATH=/parser-service/parser-service-1.0.0.jar
      - QDRANT_PATH=/data/qdrant
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-openai/gpt-oss-120b}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      - CORS_ORIGINS=http://localhost:5173
      - API_HOST=0.0.0.0
    volumes:
      - ./data:/data
      - ./parser-service/target:/parser-service:ro
    env_file:
      - .env

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend